<script>
/* ===== Supabase：帳號／名稱／密碼登入註冊（Email 僅作為 Supabase 內部識別，不顯示給使用者） ===== */
function normalizeUsername(value) {
  return String(value || "").trim().toLowerCase();
}

function usernameToAuthEmail(username) {
  return normalizeUsername(username) + "@exam.local";
}

function validateUsername(username) {
  return /^[a-z0-9._-]{3,32}$/.test(username);
}

function setLoginStatus(message, isError = false) {
  const el = document.getElementById("loginStatus");
  if (!el) return;
  el.textContent = message;
  el.style.color = isError ? "#c62828" : "#2e7d32";
}

// profiles 尚未建立或讀取失敗時，仍以登入帳號的 metadata 顯示使用者資訊。
function getDisplayProfile(profile, user) {
  const emailUsername = String(user?.email || "").replace(/@exam\.local$/i, "").trim();
  const username = String(profile?.username || user?.user_metadata?.username || emailUsername || "").trim();
  const name = String(profile?.name || user?.user_metadata?.name || username || "使用者").trim() || "使用者";
  return { name, username };
}

function updateSiteMenuUser(profile, user) {
  const el = document.getElementById("siteMenuUser");
  if (!el || !user) return;
  const display = getDisplayProfile(profile, user);
  el.textContent = display.username ? `${display.name}　帳號：${display.username}` : display.name;
}

function showLoginMode(mode) {
  const loginForm = document.getElementById("loginForm");
  const registerForm = document.getElementById("registerForm");
  if (!loginForm || !registerForm) return;

  const isRegister = mode === "register";
  loginForm.style.display = isRegister ? "none" : "block";
  registerForm.style.display = isRegister ? "block" : "none";
  setLoginStatus("");
}

async function loginUser() {
  const username = normalizeUsername(document.getElementById("loginUsername")?.value);
  const password = document.getElementById("loginPassword")?.value || "";

  if (!username || !password) {
    setLoginStatus("請輸入帳號和密碼", true);
    return;
  }
  if (!validateUsername(username)) {
    setLoginStatus("帳號需 3～32 碼，只能使用英文、數字、.、_、-", true);
    return;
  }

  setLoginStatus("登入中...");

  const { data, error } = await supabaseClient.auth.signInWithPassword({
    email: usernameToAuthEmail(username),
    password
  });

  if (error) {
    console.error(error);
    setLoginStatus("登入失敗：帳號或密碼錯誤", true);
    return;
  }

  document.body.classList.add("supabase-authenticated");
  setLoginStatus("登入成功！");
  console.log("目前使用者：", data.user);

  try {
    await syncCurrentUserDisplay();
    if (typeof cleanPage === "function") cleanPage();
    if (typeof showInitialPage === "function") showInitialPage();
    if (typeof updateHomepageErrorRate === "function") updateHomepageErrorRate();
  } catch (e) {
    console.error("登入後同步／首頁建立失敗：", e);
    setLoginStatus("登入成功，但資料同步失敗，請重新整理。", true);
  }
}

async function registerUser() {
  const name = String(document.getElementById("registerName")?.value || "").trim();
  const username = normalizeUsername(document.getElementById("registerUsername")?.value);
  const password = document.getElementById("registerPassword")?.value || "";
  const confirmPassword = document.getElementById("registerPasswordConfirm")?.value || "";

  if (!name || !username || !password || !confirmPassword) {
    setLoginStatus("請完整填寫名稱、帳號、密碼和確認密碼", true);
    return;
  }
  if (!validateUsername(username)) {
    setLoginStatus("帳號需 3～32 碼，只能使用英文、數字、.、_、-", true);
    return;
  }
  if (password.length < 6) {
    setLoginStatus("密碼至少需要 6 個字元", true);
    return;
  }
  if (password !== confirmPassword) {
    setLoginStatus("兩次輸入的密碼不一致", true);
    return;
  }

  setLoginStatus("註冊中...");

  const authEmail = usernameToAuthEmail(username);
  const { data, error } = await supabaseClient.auth.signUp({
    email: authEmail,
    password,
    options: {
      data: {
        name,
        username
      }
    }
  });

  if (error) {
    console.error(error);
    setLoginStatus("註冊失敗：" + (error.message || "請稍後再試"), true);
    return;
  }

  if (!data.user) {
    setLoginStatus("註冊失敗：沒有建立使用者", true);
    return;
  }

  // 需要先在 Supabase 建立 public.profiles（見頁面下方說明）
  let profileError = null;
  if (data.session) {
    const result = await supabaseClient.from("profiles").upsert({
      id: data.user.id,
      name,
      username,
      created_at: new Date().toISOString()
    }, { onConflict: "id" });
    profileError = result.error;
  }

  if (profileError) {
    console.error(profileError);
    setLoginStatus("帳號已建立，但 profiles 建立失敗：" + profileError.message, true);
    return;
  }

  if (data.session) {
    document.body.classList.add("supabase-authenticated");
    setLoginStatus("註冊成功，已登入！");
    try {
      await syncCurrentUserDisplay();
      if (typeof cleanPage === "function") cleanPage();
      if (typeof showInitialPage === "function") showInitialPage();
      if (typeof updateHomepageErrorRate === "function") updateHomepageErrorRate();
    } catch(e) {
      console.warn("註冊後同步失敗：",e);
    }
  } else {
    setLoginStatus("帳號已建立；請到 Supabase 關閉 Confirm email，之後即可直接用帳號登入。", false);
  }
}

async function refreshUserProfile() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (!user) return null;

  const { data: profile, error } = await supabaseClient
    .from("profiles")
    .select("id,name,username,created_at")
    .eq("id", user.id)
    .maybeSingle();

  if (error) console.warn("讀取 profiles 失敗，改用登入帳號資訊顯示：", error);

  const displayProfile = getDisplayProfile(error ? null : profile, user);
  updateSiteMenuUser(error ? null : profile, user);

  const panel = document.getElementById("loginPanel");
  if (panel) {
    panel.innerHTML = `
      <div style="font-size:20px;font-weight:bold;text-align:center">✅ 已登入</div>
      <div id="loginProfileName" style="text-align:center;margin-top:8px"></div>
      <div style="text-align:center;margin-top:4px;font-size:14px;color:#666">帳號：<span id="loginProfileUsername"></span></div>
      <button type="button" onclick="logoutUser()" style="display:block;margin:12px auto 0;padding:9px 18px;cursor:pointer">登出</button>
    `;
    // 名稱與帳號皆視為純文字，避免把使用者輸入當成 HTML 執行。
    panel.querySelector("#loginProfileName").textContent = displayProfile.name;
    panel.querySelector("#loginProfileUsername").textContent = displayProfile.username;
  }
  return displayProfile;
}

async function logoutUser() {
  const { error } = await supabaseClient.auth.signOut();
  if (error) {
    setLoginStatus("登出失敗：" + error.message, true);
    return;
  }
  questionStatsCurrentUserId = null;
  localStorage.removeItem("questionStatsCurrentUserId");
  document.body.classList.remove("supabase-authenticated");
  location.reload();
}

async function checkLogin() {
  const { data: { user } } = await supabaseClient.auth.getUser();
  if (user) {
    document.body.classList.add("supabase-authenticated");
    console.log("已登入：", user.email);
    await syncCurrentUserDisplay();
  } else {
    questionStatsCurrentUserId = null;
    localStorage.removeItem("questionStatsCurrentUserId");
    document.body.classList.remove("supabase-authenticated");
    console.log("目前尚未登入");
  }
}

<script>
(function () {
    function styleSubjectTrueFalse() {
        try {
            var subjectEl = document.getElementById("subject");
            if (!subjectEl) return;
            var subject = subjectEl.value || "";
            if (subject.indexOf("學科") === -1) return;

            // 是非題通常使用 c0、c1... 或 ct0、ct1... 題目容器。
            var nodes = document.querySelectorAll('[id^="ct"], [id^="cr"]');
            nodes.forEach(function (el) {
                if (/^(ct|cr)\d+$/.test(el.id)) {
                    el.classList.add("subject-truefalse-question");
                }
            });
        } catch (e) {}
    }

    document.addEventListener("DOMContentLoaded", styleSubjectTrueFalse);
    window.addEventListener("load", styleSubjectTrueFalse);

    // 原頁面是動態建立題目，因此定期檢查一次即可。
    var count = 0;
    var timer = setInterval(function () {
        styleSubjectTrueFalse();
        if (++count >= 20) clearInterval(timer);
    }, 300);
})();
</script>

<script>
(function () {
    function getCurrentSubject() {
        try {
            var el = document.getElementById("subject");
            if (el) {
                if (el.tagName === "SELECT" && el.options.length) {
                    return el.options[el.selectedIndex].text || el.value || "";
                }
                return el.value || el.textContent || "";
            }

            // 常見的科目選擇欄位名稱
            var candidates = document.querySelectorAll(
                '[id*="subject" i], [id*="Subject" i], [name*="subject" i], [name*="Subject" i]'
            );
            for (var i = 0; i < candidates.length; i++) {
                var v = candidates[i].value || candidates[i].textContent || "";
                if (v.trim()) return v.trim();
            }
        } catch (e) {}
        return "";
    }

    function styleSubjectTrueFalse() {
        try {
            var subject = getCurrentSubject();
            if (subject.indexOf("學科") === -1) return;

            // 是非題題目容器
            var nodes = document.querySelectorAll('[id^="ct"], [id^="cr"]');
            nodes.forEach(function (el) {
                if (/^(ct|cr)\d+$/.test(el.id)) {
                    el.classList.add("subject-truefalse-question");
                }
            });
        } catch (e) {}
    }

    function applyAll() {
        styleSubjectTrueFalse();
    }

    document.addEventListener("DOMContentLoaded", applyAll);
    window.addEventListener("load", applyAll);

    // 題目與測驗畫面為動態建立，持續監看一小段時間
    var count = 0;
    var timer = setInterval(function () {
        applyAll();
        if (++count >= 30) clearInterval(timer);
    }, 300);
})();
</script>

<script id="v40-comfort-js">
(function(){
  let lastQuestionState=false;
  let lastAnswered=-1,lastTotal=-1;
  let initialized=false;

  function questionPage(){
    const c=document.getElementById("container");
    return !!(c && (
      c.querySelector('select[id^="sc"]') ||
      c.querySelector('input[type="radio"][name^="s"]') ||
      c.querySelector('input[type="checkbox"][name^="m"]')
    ));
  }

  function toast(msg){
    let t=document.getElementById("v40-toast");
    if(!t){
      t=document.createElement("div");
      t.id="v40-toast";
      t.className="v40-toast";
      document.body.appendChild(t);
    }
    t.textContent=msg;
    t.style.display="block";
    clearTimeout(t._timer);
    t._timer=setTimeout(()=>t.style.display="none",1000);
  }

  // 輕量計算：避免每次 DOM 變動都掃描整份題目。
  function answeredCount(){
    const selects=[...document.querySelectorAll('select[id^="sc"]')];
    const radios=[...document.querySelectorAll('input[type="radio"][name^="s"]')];
    const checks=[...document.querySelectorAll('input[type="checkbox"][name^="m"]')];

    const radioNames=new Set(radios.map(x=>x.name));
    const checkNames=new Set(checks.map(x=>x.name));

    let total=selects.length+radioNames.size+checkNames.size;
    let answered=selects.filter(x=>x.value!=="").length;

    radioNames.forEach(name=>{
      if(radios.some(x=>x.name===name && x.checked)) answered++;
    });
    checkNames.forEach(name=>{
      if(checks.some(x=>x.name===name && x.checked)) answered++;
    });
    return {answered,total};
  }

  function updateProgress(force=false){
    const p=document.getElementById("v40-progress");
    if(!p)return;

    const active=questionPage();
    if(!active){
      if(lastQuestionState)p.style.display="none";
      lastQuestionState=false;
      return;
    }

    const a=answeredCount();
    if(!force && a.answered===lastAnswered && a.total===lastTotal && lastQuestionState)return;

    lastQuestionState=true;
    lastAnswered=a.answered;
    lastTotal=a.total;

    const pct=a.total?Math.round(a.answered/a.total*100):0;
    p.style.display="block";
    p.querySelector(".fill").style.width=pct+"%";
    p.querySelector(".txt").textContent=`已作答 ${a.answered} / ${a.total}　${pct}%`;
  }

  function addProgress(){
    if(document.getElementById("v40-progress"))return;
    const p=document.createElement("div");
    p.id="v40-progress";
    p.className="v40-progress";
    p.innerHTML='<div class="txt">作答進度</div><div class="bar"><div class="fill"></div></div>';
    document.body.appendChild(p);
  }
  function hookSubmitGuard(){
    if(document.documentElement.dataset.v40Guard)return;
    document.documentElement.dataset.v40Guard="1";

    document.addEventListener("click",function(e){
      const t=e.target instanceof Element?e.target:null;
      if(!t)return;
      const btn=t.closest("#resultButton");
      if(!btn || !questionPage())return;

      const a=answeredCount();
      if(a.total && a.answered<a.total){
        const ok=confirm(`還有 ${a.total-a.answered} 題尚未作答。\n確定現在要交卷嗎？`);
        if(!ok)e.stopImmediatePropagation();
      }
    },true);
  }

  function init(){
    if(initialized)return;
    initialized=true;
    addProgress();
    hookSubmitGuard();

    // 不再監聽整個 body 的 MutationObserver。
    // 原因：刷題模式會一次建立大量題目，MutationObserver 會被觸發數百/數千次，
    // 導致頁面卡住。改成低頻輪詢，只在畫面穩定後更新進度。
    setInterval(()=>updateProgress(false),500);

    document.addEventListener("change",()=>{
      if(questionPage()) updateProgress(true);
    },true);

    document.addEventListener("input",()=>{
      if(questionPage()) updateProgress(true);
    },true);
  }

  if(document.readyState==="loading"){
    document.addEventListener("DOMContentLoaded",init);
  }else{
    init();
  }
})();
</script>

<script id="v40-wrong-type-fix-js">
(function(){
  function getQuestionTypeFromText(questionText){
    const clean=(questionText||"").replace(/<[^>]*>/g,"").trim();
    try{
      const types=["是非","單選","複選"];
      for(const type of types){
        const arr=(window.questions && window.questions[type]) || [];
        for(const q of arr){
          const qt=(q["題目"]||"").replace(/<[^>]*>/g,"").trim();
          if(qt===clean)return type;
        }
      }
    }catch(e){}
    return "";
  }

  function replaceUnknownTypes(){
    const body=document.body;
    if(!body)return;
    const nodes=[...body.querySelectorAll("*")];
    nodes.forEach(el=>{
      if(el.children.length>0)return;
      const t=(el.textContent||"").trim();
      if(t==="題型未記錄" || t==="未記錄"){
        // 往父層找題目文字，嘗試重新判斷
        const parent=el.parentElement;
        const text=parent ? parent.innerText : "";
        const type=getQuestionTypeFromText(text);
        if(type){
          el.textContent="題型："+type;
          el.classList.add("v40-wrong-type-badge");
        }
      }
    });
  }

  function enhanceTF(){
    // 僅針對錯最多題型區塊中明確標示為「是非」的題目，
    // 將選項文字 T/F、True/False 或 是/否 顯示成圈叉。
    const all=[...document.querySelectorAll("div,li,p,td")];
    all.forEach(el=>{
      if(el.children.length>3)return;
      const text=(el.innerText||"").trim();
      if(!/題型\s*[：:]\s*是非/.test(text))return;
      const options=el.parentElement ? [...el.parentElement.querySelectorAll("label,button,li,td,span")] : [];
      options.forEach(op=>{
        if(op.dataset.v40tf)return;
        const s=(op.textContent||"").trim();
        if(/^(T|True|是)$/i.test(s)){
          op.dataset.v40tf="1"; op.textContent="⭕";
          op.classList.add("v40-tf-option");
        }else if(/^(F|False|否)$/i.test(s)){
          op.dataset.v40tf="1"; op.textContent="❌";
          op.classList.add("v40-tf-option");
        }
      });
    });
  }

  function run(){
    replaceUnknownTypes();
    enhanceTF();
  }
  if(document.readyState==="loading")document.addEventListener("DOMContentLoaded",run);
  else run();
  new MutationObserver(run).observe(document.body,{childList:true,subtree:true});
})();
</script>

<script id="v40-only-tf-js">
(function(){
  function clean(s){
    return String(s||"").replace(/<br\s*\/?>/gi," ").replace(/<[^>]*>/g,"").replace(/\s+/g," ").trim();
  }

  function answerSymbol(q){
    const a=clean(q && q["答案"]);
    if(/^(O|○|⭕|是|正確|對)$/i.test(a)) return "⭕";
    if(/^(X|×|❌|否|錯誤|錯)$/i.test(a)) return "❌";
    return "";
  }

  function findTF(questionText){
    const target=clean(questionText);
    try{
      if(typeof data==="undefined") return "";
      for(const subject of Object.keys(data)){
        const group=data[subject];
        if(!group || !Array.isArray(group["是非"])) continue;
        for(const q of group["是非"]){
          if(clean(q["題目"])===target) return answerSymbol(q);
        }
      }
    }catch(e){}
    return "";
  }

  function enhance(){
    const cards=[...document.querySelectorAll("div,section,article,li,td")];

    cards.forEach(card=>{
      if(card.querySelector(".v40-only-tf-answer")) return;

      const text=clean(card.innerText||"");
      if(!/錯\s*\d+\s*次/.test(text)) return;

      // 僅允許「是非」題出現圈叉。
      // 單選/複選完全不添加任何圈叉答案標記。
      if(!/是非/.test(text)) return;
      if(/單選|複選/.test(text)) return;

      const candidates=[...card.querySelectorAll("p,div,span,li,label,td")]
        .map(el=>clean(el.textContent))
        .filter(t=>t && t.length>=6)
        .sort((a,b)=>b.length-a.length);

      for(const qText of candidates){
        const symbol=findTF(qText);
        if(!symbol) continue;

        const tag=document.createElement("div");
        tag.className="v40-only-tf-answer";
        tag.textContent="答案："+symbol;
        card.appendChild(tag);
        break;
      }
    });
  }

  function run(){ try{ enhance(); }catch(e){} }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",run);
  else run();

  let timer=null;
  new MutationObserver(()=>{
    clearTimeout(timer);
    timer=setTimeout(run,180);
  }).observe(document.body,{childList:true,subtree:true});
})();
</script>

    const exam = new Date(EXAM.getFullYear(), EXAM.getMonth(), EXAM.getDate());

<script id="phase4-auto-countdown">
(function () {
  const examDate = new Date(2026, 10, 7, 0, 0, 0, 0); // 2026/11/07

  function updateCountdown() {
    const now = new Date();
    const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
    const diff = Math.ceil((examDate - today) / 86400000);
    const days = Math.max(0, diff);

    // Replace the complete existing countdown text wherever it appears.
    const pattern = /第四階段測驗：2026\/11\/07\s*(?:｜|\|)\s*距離測驗還有\s*[\d\s&nbsp;]+天/g;
    const replacement = `第四階段測驗：2026/11/07　｜　距離測驗還有：${days}天`;

    document.querySelectorAll("body *").forEach(el => {
      if (el.children.length === 0 && pattern.test(el.textContent)) {
        el.textContent = el.textContent.replace(pattern, replacement);
      }
      pattern.lastIndex = 0;
    });
  }

  if (document.readyState === "loading") {
    document.addEventListener("DOMContentLoaded", updateCountdown);
  } else {
    updateCountdown();
  }
  setInterval(updateCountdown, 60 * 1000);
})();
</script>

<script id="site-menu-theme-js">
(function(){
  function getSavedTheme(){
    return localStorage.getItem("v40-night-mode") === "1";
  }

  function applyTheme(){
    const on = getSavedTheme();
    document.body.classList.toggle("v40-night", on);
    const btn = document.getElementById("menuThemeBtn");
    if(btn) btn.textContent = on ? "☀️ 日間模式" : "🌙 夜間模式";
  }

  function openPanel(show){
    const panel=document.getElementById("siteMenuPanel");
    const toggle=document.getElementById("siteMenuToggle");
    if(!panel||!toggle) return;
    panel.hidden=!show;
    toggle.setAttribute("aria-expanded", String(show));
  }

  function init(){
    applyTheme();

    const toggle=document.getElementById("siteMenuToggle");
    const panel=document.getElementById("siteMenuPanel");
    if(!toggle||!panel) return;

    toggle.addEventListener("click",()=>openPanel(panel.hidden));
    document.addEventListener("click",e=>{
      const menu=document.getElementById("siteMenu");
      if(menu && !menu.contains(e.target)) openPanel(false);
    });
    document.addEventListener("keydown",e=>{
      if(e.key === "Escape") openPanel(false);
    });

    document.getElementById("menuThemeBtn")?.addEventListener("click",()=>{
      const next = document.body.classList.toggle("v40-night");
      localStorage.setItem("v40-night-mode", next ? "1" : "0");
      applyTheme();
    });

    function openStatsSection(sectionId){
      if(typeof updateHomepageErrorRate!=="function") return;
      updateHomepageErrorRate();
      const ids=["homepage-error-rate","stats-detail-subjects","stats-detail-risk","stats-ranking-panel"];
      ids.forEach(id=>{
        const el=document.getElementById(id);
        if(el) el.style.display = (id === sectionId) ? "block" : "none";
      });
      const target=document.getElementById(sectionId) || document.getElementById("homepage-error-rate");
      if(target) setTimeout(()=>target.scrollIntoView({behavior:"smooth",block:"start"}),80);
    }

    document.getElementById("menuStatsBtn")?.addEventListener("click",()=>{
      document.getElementById("menuAccountPanel")?.setAttribute("hidden","");
      openPanel(false);
      openStatsSection("homepage-error-rate");
    });

    document.getElementById("menuSubjectsBtn")?.addEventListener("click",()=>{
      document.getElementById("menuAccountPanel")?.setAttribute("hidden","");
      document.getElementById("menuSettingsPanel")?.setAttribute("hidden","");
      openPanel(false);
      openStatsSection("stats-detail-subjects");
    });

    document.getElementById("menuRiskBtn")?.addEventListener("click",()=>{
      document.getElementById("menuAccountPanel")?.setAttribute("hidden","");
      openPanel(false);
      openStatsSection("stats-detail-risk");
    });

    document.getElementById("menuRankBtn")?.addEventListener("click",()=>{
      document.getElementById("menuAccountPanel")?.setAttribute("hidden","");
      openPanel(false);
      openStatsSection("stats-ranking-panel");
    });

    function refreshAccountCard(){
      try{
        const stats = (typeof getErrorStats === "function") ? (getErrorStats() || {}) : {};
        const rows = Object.values(stats || {});
        let attempts=0, correct=0, wrong=0, bestStreak=0;
        rows.forEach(r=>{
          attempts += Math.max(0, Number(r.attempts)||0);
          correct += Math.max(0, Number(r.correct)||0);
          wrong += Math.max(0, Number(r.wrong)||0);
          bestStreak = Math.max(bestStreak, Math.max(0, Number(r.correctStreak)||0));
        });
        if (correct + wrong === 0) correct = Math.max(0, attempts - wrong);
        const accuracy=attempts ? (correct/attempts*100) : 0;
        const a=document.getElementById("accountTotalAttempts");
        const b=document.getElementById("accountAccuracy");
        const c=document.getElementById("accountBestStreak");
        if(a) a.textContent=attempts.toLocaleString();
        if(b) b.textContent=accuracy.toFixed(1)+"%";
        if(c) c.textContent=bestStreak.toLocaleString();
      }catch(e){ console.warn("更新帳號統計失敗",e); }
    }

    async function loadAccountCard(){
      const nameInput=document.getElementById("accountNameInput");
      const usernameInput=document.getElementById("accountUsernameInput");
      const status=document.getElementById("accountSettingsStatus");
      if(!nameInput || !usernameInput) return;

      const {data:{user}}=await supabaseClient.auth.getUser();
      if(!user) return;

      try{
        const {data:profile,error}=await supabaseClient
          .from("profiles").select("id,name,username").eq("id",user.id).maybeSingle();
        if(error) throw error;

        const displayProfile=getDisplayProfile(profile, user);
        const displayName=displayProfile.name;
        const username=displayProfile.username;
        nameInput.value=profile?.name || displayName;
        usernameInput.value=username;
        updateSiteMenuUser(profile, user);

        const nameEl=document.getElementById("accountDisplayName");
        const userEl=document.getElementById("accountDisplayUsername");
        const avatar=document.getElementById("accountAvatar");
        if(nameEl) nameEl.textContent=displayName;
        if(userEl) userEl.textContent=username ? "@"+username : "";
        if(avatar) avatar.textContent=(String(displayName).trim().charAt(0)||"U").toUpperCase();

        refreshAccountCard();
        if(status) status.textContent="";
      }catch(e){
        console.warn("讀取帳號設定失敗",e);
        if(status) status.textContent="讀取帳號資料失敗";
      }
    }

    async function syncCurrentUserDisplay(){
      try{
        const {data:{user}}=await supabaseClient.auth.getUser();
        if(!user) return null;

        // 先指定 user_id，避免殘留上一個帳號的 localStorage key
        questionStatsCurrentUserId=user.id;
        localStorage.setItem("questionStatsCurrentUserId",user.id);

        // 以 Supabase 為準重新載入目前帳號的題目統計
        if(typeof loadCurrentUserQuestionStatsFromSupabase==="function"){
          await loadCurrentUserQuestionStatsFromSupabase();
        }

        // 個人資料與統計在同一次同步完成後再更新畫面
        if(typeof refreshUserProfile==="function"){
          await refreshUserProfile();
        }
        if(typeof loadAccountCard==="function"){
          await loadAccountCard();
        }
        if(typeof updateHomepageErrorRate==="function"){
          updateHomepageErrorRate();
        }

        return user;
      }catch(e){
        console.warn("同步目前帳號個人資料與正確率失敗：",e);
        return null;
      }
    }

    function setAccountStatus(message,isError=false){
      const status=document.getElementById("accountSettingsStatus");
      if(!status) return;
      status.textContent=message;
      status.style.color=isError ? "#b42318" : "#2e7d32";
    }

    document.getElementById("menuSettingsBtn")?.addEventListener("click",()=>{
      const settings=document.getElementById("menuSettingsPanel");
      const account=document.getElementById("menuAccountPanel");
      if(account) account.hidden=true;
      if(!settings) return;
      settings.hidden=!settings.hidden;
    });

    document.getElementById("menuAccountBtn")?.addEventListener("click",()=>{
      const account=document.getElementById("menuAccountPanel");
      const settings=document.getElementById("menuSettingsPanel");
      if(settings) settings.hidden=true;
      if(!account) return;
      account.hidden=!account.hidden;
      if(!account.hidden) syncCurrentUserDisplay();
    });

    document.getElementById("accountSaveProfileBtn")?.addEventListener("click",async()=>{
      const name=(document.getElementById("accountNameInput")?.value||"").trim();
      if(!name){ setAccountStatus("名稱不可為空白",true); return; }

      const {data:{user}}=await supabaseClient.auth.getUser();
      if(!user){ setAccountStatus("尚未登入",true); return; }

      setAccountStatus("儲存中...");
      const {error}=await supabaseClient.from("profiles").update({name}).eq("id",user.id);
      if(error){
        console.error(error);
        setAccountStatus("儲存失敗："+error.message,true);
        return;
      }
      setAccountStatus("個人資料已更新");
      await loadAccountCard();
    });

    document.getElementById("accountChangePasswordBtn")?.addEventListener("click",async()=>{
      const current=document.getElementById("accountCurrentPassword")?.value||"";
      const next=document.getElementById("accountNewPassword")?.value||"";
      const confirmPwd=document.getElementById("accountConfirmPassword")?.value||"";
      if(!current || !next || !confirmPwd){ setAccountStatus("請完整填寫密碼欄位",true); return; }
      if(next.length<6){ setAccountStatus("新密碼至少需要 6 個字元",true); return; }
      if(next!==confirmPwd){ setAccountStatus("兩次新密碼不一致",true); return; }

      const {data:{user}}=await supabaseClient.auth.getUser();
      if(!user){ setAccountStatus("尚未登入",true); return; }

      setAccountStatus("驗證目前密碼中...");
      const {error:verifyError}=await supabaseClient.auth.signInWithPassword({
        email:user.email,password:current
      });
      if(verifyError){ setAccountStatus("目前密碼不正確",true); return; }

      setAccountStatus("修改密碼中...");
      const {error:updateError}=await supabaseClient.auth.updateUser({password:next});
      if(updateError){ setAccountStatus("修改密碼失敗："+updateError.message,true); return; }

      document.getElementById("accountCurrentPassword").value="";
      document.getElementById("accountNewPassword").value="";
      document.getElementById("accountConfirmPassword").value="";
      setAccountStatus("密碼已修改完成");
    });

    document.getElementById("accountResetStatsBtn")?.addEventListener("click",async()=>{
      if(typeof resetErrorStats === "function") await resetErrorStats();
    });

    document.getElementById("accountSignOutBtn")?.addEventListener("click",async()=>{
      if(!confirm("確定要登出目前帳號嗎？")) return;
      if(typeof logoutUser==="function") await logoutUser();
    });

    document.getElementById("menuLogoutBtn")?.addEventListener("click",async()=>{
      if(typeof logoutUser==="function") await logoutUser();
    });

    const originalRefresh = window.refreshUserProfile;
    if(typeof originalRefresh === "function") {
      const wrapped = async function(){
        const result = await originalRefresh.apply(this, arguments);
        const userEl=document.getElementById("siteMenuUser");
        if(userEl && result){ userEl.textContent = (result.name||"") + (result.username?"　帳號："+result.username:""); }
        return result;
      };
      window.refreshUserProfile = wrapped;
    }
  }

  if(document.readyState==="loading") document.addEventListener("DOMContentLoaded",init);
  else init();
})();
</script>

<script id="v40-home-countdown-js">

})();

<script>
    //globol settings
    cQuestionNum = 10;//是非題數
    sQuestionNum = 20;//單選題數
    mQuestionNum = 20;//複選題數
    scorePerC = 0;//是非題分數
    scorePerS = 2;//單選題分數
    scorePerM = 2;//複選題分數
    totalScore = 0;//總分
    questions={};
    wrongOnly = false; // 只複習曾經答錯過的題目
    // 僅「測驗模式」會計入班排行；刷題與錯題複習只保留個人練習紀錄。
    isRankedExamMode = false;

    console.log(data);

    // 錯題複習：與首頁「錯最多題型」前10名連動。
    // 排名同時考慮錯誤率、累計錯誤次數與最近連續答對次數；連續答對越多，優先度越低。
    function getReviewPriority(r) {
        const attempts = Math.max(0, Number(r.attempts) || 0);
        const wrong = Math.max(0, Number(r.wrong) || 0);
        if (attempts < 2 || wrong <= 0) return -1;
        const errorRate = wrong / attempts;
        const correctStreak = Math.max(0, Number(r.correctStreak) || 0);
        const recent = Array.isArray(r.recentResults) ? r.recentResults.slice(-5) : [];
        const recentWrong = recent.filter(v => v === 0).length;
        const recentBonus = recent.length ? (recentWrong / recent.length) * 20 : 0;
        return errorRate * 100 + Math.min(wrong * 2, 20) + recentBonus - Math.min(correctStreak * 8, 32);
    }

    function getTopWrongReviewKeys(limit = 10) {
        const stats = getErrorStats();
        return Object.entries(stats)
            .filter(([, r]) => (Number(r.attempts) || 0) >= 2 && (Number(r.wrong) || 0) > 0)
            .sort(([,a],[,b]) => getReviewPriority(b) - getReviewPriority(a))
            .slice(0, limit)
            .map(([key]) => key);
    }

    function filterToWrongQuestions() {
        if (!wrongOnly) return;
        const stats = getErrorStats();
        const topKeys = new Set(getTopWrongReviewKeys(10));
        ["是非","單選","複選"].forEach(type => {
            const arr = questions[type] || [];
            questions[type] = arr.filter(q => {
                const subject = q.__subject || "其他科目";
                const text = (q["題目"] || "").replace(/<[^>]*>/g, "").trim();
                const key = subject + "||" + text;
                return topKeys.has(key) && stats[key] && (stats[key].wrong || 0) > 0;
            });
        });
    }

    //函數:初始化題目物件
    function prepareQuestions(subject,full, shuffle) {
	fullQuestion=full;
	isRankedExamMode = Boolean(shuffle && !full && !wrongOnly);
	if(subject.includes("準則測驗")){
	    questions["是非"]=[];
	    questions["單選"]=[];
	    questions["複選"]=[];
	    step=subject.split("-")[0];
	    cdata=JSON.parse(JSON.stringify(data));
	    for(let i in cdata){
		if(i.includes(step)&&i.includes("準則")){
		    for(let j=0;j<cdata[i]["單選"].length;j++){
		    	cdata[i]["單選"][j]["題目"];
		    }
		    for(let j=0;j<cdata[i]["複選"].length;j++){
		    	cdata[i]["複選"][j]["題目"];
		    }
		    cdata[i]["單選"].forEach(q => q.__subject = i);
		    cdata[i]["複選"].forEach(q => q.__subject = i);
		    questions["單選"].push(...cdata[i]["單選"]);
		    questions["複選"].push(...cdata[i]["複選"]);
		}
	    }

    // 登入後從 Supabase 載入「目前 user_id」的題目統計，不會讀到其他帳號
    async function loadCurrentUserQuestionStatsFromSupabase() {
        try {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user) {
                questionStatsCurrentUserId = null;
                localStorage.removeItem("questionStatsCurrentUserId");
                return {};
            }

            questionStatsCurrentUserId = user.id;
            localStorage.setItem("questionStatsCurrentUserId", user.id);

            const { data: rows, error } = await supabaseClient
                .from("question_stats")
                .select("question_id,subject,question_type,attempts,correct,wrong,correct_streak,last_answered_at")
                .eq("user_id", user.id);

            if (error) throw error;

            const stats = {};
            (rows || []).forEach(row => {
                const questionId = String(row.question_id || "");
                // 班排行的獨立紀錄不混入個人錯題與練習統計。
                if (questionId.startsWith("rank_exam||")) return;
                const separator = questionId.indexOf("||");
                const subject = row.subject || (separator >= 0 ? questionId.slice(0, separator) : "其他科目");
                const question = separator >= 0 ? questionId.slice(separator + 2) : questionId;
                const key = questionId || (subject + "||" + question);

                stats[key] = {
                    subject: subject,
                    question: question,
                    questionType: row.question_type || "",
                    options: [],
                    answer: "",
                    attempts: Number(row.attempts) || 0,
                    correct: Number(row.correct) || 0,
                    wrong: Number(row.wrong) || 0,
                    recentResults: [],
                    correctStreak: Number(row.correct_streak) || 0,
                    lastAnsweredAt: row.last_answered_at || null
                };
            });

            saveErrorStats(stats);
            return stats;
        } catch (e) {
            console.warn("載入目前使用者 Supabase 題目紀錄失敗：", e);
            return getErrorStats();
        }
    }

    async function saveQuestionToSupabase(question, correct, questionType) {
        try {
            const { data: { user } } = await supabaseClient.auth.getUser();
            if (!user || !question || !question["題目"]) return;

            questionStatsCurrentUserId = user.id;
            localStorage.setItem("questionStatsCurrentUserId", user.id);

            const subject = question.__subject || "其他科目";
            const cleanQuestion = String(question["題目"] || "").replace(/<[^>]*>/g, "").trim();
            const questionId = subject + "||" + cleanQuestion;

            const { data: oldRow, error: readError } = await supabaseClient
                .from("question_stats")
                .select("attempts,correct,wrong,correct_streak")
                .eq("user_id", user.id)
                .eq("question_id", questionId)
                .maybeSingle();

            if (readError) throw readError;

            const attempts = (Number(oldRow?.attempts) || 0) + 1;
            const correctCount = (Number(oldRow?.correct) || 0) + (correct ? 1 : 0);
            const wrongCount = (Number(oldRow?.wrong) || 0) + (correct ? 0 : 1);
            const streak = correct ? (Number(oldRow?.correct_streak) || 0) + 1 : 0;

            const now = new Date().toISOString();
            const payload = {
                user_id: user.id,
                question_id: questionId,
                subject,
                question_type: questionType || "",
                attempts,
                correct: correctCount,
                wrong: wrongCount,
                correct_streak: streak,
                last_answered_at: now,
                updated_at: now
            };

            const { error: saveError } = await supabaseClient
                .from("question_stats")
                .upsert(payload, { onConflict: "user_id,question_id" });

            if (saveError) throw saveError;
            console.log("✅ 已同步目前帳號的 Supabase 題目紀錄：", questionId);
        } catch (e) {
            console.warn("Supabase 題目同步失敗，本機仍保留目前帳號紀錄：", e);
        }
    }

    function recordQuestionResult(question, correct, questionType) {
        if (!question || !question["題目"]) return;

        const subject = question.__subject || "其他科目";
        const key = subject + "||" + question["題目"].replace(/<[^>]*>/g, "").trim();
        const stats = getErrorStats();

        if (!stats[key]) stats[key] = {
            subject,
            question: question["題目"],
            questionType: questionType || "",
            options: Array.isArray(question["選項"]) ? question["選項"].slice() : [],
            answer: Array.isArray(question["答案"]) ? question["答案"].slice() : (question["答案"] || ""),
            attempts: 0,
            wrong: 0,
            recentResults: [],
            correctStreak: 0
        };

        if (questionType) stats[key].questionType = questionType;
        if (Array.isArray(question["選項"])) stats[key].options = question["選項"].slice();
        if (question["答案"] !== undefined) {
            stats[key].answer = Array.isArray(question["答案"]) ? question["答案"].slice() : question["答案"];
        }

        stats[key].attempts++;
        if (!Array.isArray(stats[key].recentResults)) stats[key].recentResults = [];
        stats[key].recentResults.push(correct ? 1 : 0);
        if (stats[key].recentResults.length > 8) stats[key].recentResults = stats[key].recentResults.slice(-8);

        if (correct) {
            stats[key].correctStreak = (Number(stats[key].correctStreak) || 0) + 1;
        } else {
            stats[key].wrong++;
            stats[key].correctStreak = 0;
        }

        // 只存到目前登入帳號自己的 localStorage
        saveErrorStats(stats);

        // 同步同一個 user_id 的 Supabase question_stats
        void saveQuestionToSupabase(question, correct, questionType);

        // 只有一般測驗模式（非刷題、非錯題複習）才另存班排行資料。
        if (isRankedExamMode) void saveRankingQuestionToSupabase(question, correct, questionType);
    }
    function findQuestionData(record) {
        try {
            const types = ["是非", "單選", "複選"];
            for (const type of types) {
                const arr = questions[type] || [];
                for (const q of arr) {
                    const s = q.__subject || "其他科目";
                    const qText = (q["題目"] || "").replace(/<[^>]*>/g, "").trim();
                    if (s === record.subject &&
                        qText === String(record.question || "").replace(/<[^>]*>/g, "").trim()) {
                        return {
                            options: q["選項"] || [],
                            answer: q["答案"],
                            type: type
                        };
                    }
                }
            }
        } catch(e) {}
        return {
            options: record.options || [],
            answer: record.answer,
            type: record.questionType || "未記錄"
        };
    }

    // 班排行：只採用 question_id 以 rank_exam|| 開頭的測驗模式紀錄。
    async function loadUserAnswerRanking(target) {
        if (!target) return;
        target.innerHTML = '<div style="padding:10px;color:#777">載入班排行中...</div>';
        try {
            const { data: rows, error } = await supabaseClient
                .from("question_stats")
                .select("user_id,attempts,correct,wrong,question_id,question_type")
                .like("question_id", "rank_exam||%");
            if (error) throw error;

            const users = new Map();
            (rows || []).forEach(row => {
                const userId = String(row.user_id || "").trim();
                if (!userId) return;
                let storedName = "";
                try { storedName = String(JSON.parse(row.question_type || "{}").name || "").trim(); } catch(e) {}
                if (!users.has(userId)) {
                    users.set(userId, { userId, name:storedName || "使用者", username:"", total:0, correct:0, wrong:0 });
                }
                const u = users.get(userId);
                if (storedName) u.name = storedName;
                u.total += Math.max(0, Number(row.attempts) || 0);
                u.correct += Math.max(0, Number(row.correct) || 0);
                u.wrong += Math.max(0, Number(row.wrong) || 0);
            });

            if (!users.size) {
                target.innerHTML = '<div style="color:#888">目前尚無測驗模式的班排行資料</div>';
                return;
            }

            // 讀取 profiles，將 user_id 對應成使用者名稱。
            const ids = Array.from(users.keys());
            try {
                const { data: profiles, error: profileError } = await supabaseClient
                    .from("profiles")
                    .select("id,name,username")
                    .in("id", ids);
                if (!profileError && Array.isArray(profiles)) {
                    profiles.forEach(p => {
                        const u = users.get(String(p.id || ""));
                        if (u) {
                            u.name = String(p.name || p.username || "使用者").trim() || "使用者";
                            u.username = String(p.username || "").trim();
                        }
                    });
                }
            } catch (profileError) {
                console.warn("排行榜名稱載入失敗，改以使用者代號顯示", profileError);
            }

            const ranking = Array.from(users.values())
                .map(u => {
                    // 以正確率作為勝率；資料不一致時用總數重新校正。
                    const total = Math.max(u.total, u.correct + u.wrong);
                    const correct = Math.min(Math.max(0, u.correct), total);
                    const wrong = Math.max(0, total - correct);
                    const winRate = total > 0 ? correct / total * 100 : 0;
                    return { ...u, total, correct, wrong, winRate };
                })
                .filter(u => u.total > 0)
                .sort((a,b) =>
                    b.winRate - a.winRate ||
                    b.correct - a.correct ||
                    b.total - a.total ||
                    a.name.localeCompare(b.name, "zh-Hant")
                );

            if (!ranking.length) {
                target.innerHTML = '<div style="color:#888">目前尚無可排名的測驗資料</div>';
                return;
            }

            target.innerHTML = `
                <div style="overflow-x:auto">
                  <table style="width:100%;border-collapse:collapse;min-width:620px;text-align:center">
                    <thead>
                      <tr>
                        <th style="padding:9px">排名</th>
                        <th style="padding:9px;text-align:left">使用者</th>
                        <th style="padding:9px">答題數</th>
                        <th style="padding:9px">答對</th>
                        <th style="padding:9px">答錯</th>
                        <th style="padding:9px">勝率</th>
                      </tr>
                    </thead>
                    <tbody>
                      ${ranking.slice(0,50).map((u,i)=>`
                        <tr>
                          <td style="padding:9px;font-weight:900">${i+1}</td>
                          <td style="padding:9px;text-align:left;font-weight:800">${escapeHtml(u.name)}</td>
                           <td style="padding:9px">${u.total}</td>
                          <td style="padding:9px;color:#2e7d32;font-weight:800">${u.correct}</td>
                          <td style="padding:9px;color:#b42318;font-weight:800">${u.wrong}</td>
                          <td style="padding:9px;font-weight:900">${u.winRate.toFixed(1)}%</td>
                        </tr>
                      `).join("")}
                    </tbody>
                  </table>
                </div>
                <div style="margin-top:8px;color:#777;font-size:12px">僅計測驗模式；最多顯示 50 名。排名規則：勝率 → 答對題數 → 答題數</div>
            `;
        } catch(error) {
            console.error("班排行載入失敗：",error);
            target.innerHTML='<div style="color:#b42318">目前無法讀取班排行，請確認 Supabase 的 question_stats / profiles 權限設定。</div>';
        }
    }

    function updateHomepageErrorRate() {
        const summary = document.getElementById("homepageAnswerSummary");
        if (typeof renderHomepageAnswerSummary === "function") {
            const fresh = renderHomepageAnswerSummary();
            if (summary) {
                summary.replaceWith(fresh);
            } else {
                const container = document.getElementById("container");
                const subject = document.getElementById("subject");
                if (container) {
                    if (subject) {
                        const subjectRow = subject.closest(".home-subject-row");
                        if (subjectRow) subjectRow.before(fresh);
                        else container.prepend(fresh);
                    } else {
                        container.prepend(fresh);
                    }
                }
            }
        }
        ["homepage-error-rate", "stats-detail-subjects", "stats-detail-risk", "stats-ranking-panel"].forEach(id => {
            const old = document.getElementById(id);
            if (old) old.remove();
        });
        const stats = getErrorStats();
        const records = Object.values(stats);
        let total = 0, wrong = 0;
        const subjects = {};
        records.forEach(r => {
            total += r.attempts || 0;
            wrong += r.wrong || 0;
            if (!subjects[r.subject]) subjects[r.subject] = {attempts:0, wrong:0};
            subjects[r.subject].attempts += r.attempts || 0;
            subjects[r.subject].wrong += r.wrong || 0;
        });
        const correct = total - wrong;
        const accuracy = total > 0 ? (correct / total * 100) : 0;

        // 所有科目正確率排行：至少作答 1 題才列入
        const accuracyRanking = Object.entries(subjects)
            .filter(([,v]) => v.attempts > 0)
            .map(([name,v]) => ({
                name,
                attempts: v.attempts,
                correct: v.attempts - v.wrong,
                wrong: v.wrong,
                accuracy: ((v.attempts - v.wrong) / v.attempts) * 100
            }))
            .sort((a,b) => b.accuracy - a.accuracy || b.correct - a.correct || b.attempts - a.attempts);

        // 查看錯最多：依錯誤率由高至低排列，最多顯示前30題
        const highRisk = records.filter(r => r.attempts >= 2 && r.wrong > 0)
            .map(r => ({...r, errorRate: (r.wrong / r.attempts) * 100}))
            .sort((a,b) => b.errorRate - a.errorRate || b.wrong - a.wrong || b.attempts - a.attempts)
            .slice(0, 30);

        const panel = document.createElement("div");
        panel.id = "homepage-error-rate";
        panel.style.cssText = "display:none;position:relative;z-index:1;width:calc(100% - 20px);max-width:1100px;box-sizing:border-box;margin:18px auto 8px;padding:14px;border:2px solid #4b7bec;border-radius:14px;background:rgba(255,255,255,.94);box-shadow:none;font-size:16px;line-height:1.55;";

        const accuracyRows = accuracyRanking.map((r,i) => {
            return `<div style="padding:7px 0;border-bottom:1px solid #eee">
                <span style="font-weight:600">${i+1}. ${r.name}</span>
                <span style="float:right;color:#168a45;font-weight:600">${r.accuracy.toFixed(1)}%</span>
                <br><span style="color:#555">對 ${r.correct} 題 / 錯 ${r.wrong} 題 / 總 ${r.attempts} 題</span>
            </div>`;
        }).join("") || `<div style="color:#888">尚無作答紀錄</div>`;

        const renderSubjectGroup = (groupName, entries) => {
            const rows = entries.sort((a,b)=>b[1].wrong-a[1].wrong).map(([name,v]) => {
                const correctCount = v.attempts - v.wrong;
                return `<div class="subject-row" style="padding:6px 0;border-bottom:1px solid #eee">
                    <div style="font-weight:500">${name}</div>
                    <div style="color:#555">對 ${correctCount} 題 / 錯 ${v.wrong} 題 / 總 ${v.attempts} 題</div>
                </div>`;
            }).join("") || `<div style="color:#888">尚無紀錄</div>`;
            return `<div style="font-weight:bold;margin:10px 0 5px;font-size:17px">${groupName}</div>${rows}`;
        };
        const subjectEntries = Object.entries(subjects);
        const ruleEntries = subjectEntries.filter(([name]) => name.startsWith("準則-"));
        const subjectEntriesOnly = subjectEntries.filter(([name]) => name.startsWith("學科-"));
        const otherEntries = subjectEntries.filter(([name]) => !name.startsWith("準則-") && !name.startsWith("學科-"));
        const subjectRows = renderSubjectGroup("📘 準則", ruleEntries) + renderSubjectGroup("📗 學科", subjectEntriesOnly) + (otherEntries.length ? renderSubjectGroup("📙 其他", otherEntries) : "");

        const riskRows = highRisk.map((r, i) => {
            const rate=(r.wrong/r.attempts*100).toFixed(0);
            const data = findQuestionData(r);
            const options = Array.isArray(data.options) ? data.options : [];
            const answer = Array.isArray(data.answer) ? data.answer : (data.answer ? [data.answer] : []);
            const clean = s => String(s || "").replace(/<br\s*\/?>(\s*)/gi,' ').replace(/<[^>]*>/g,'').trim();
            const optionRows = options.map((opt,idx) => {
                const isCorrect = answer.some(a => clean(a) === clean(opt));
                return `<div style="padding:3px 0;${isCorrect ? 'color:#168a45;font-weight:600;' : 'color:#444;'}">${String.fromCharCode(65+idx)}. ${clean(opt)}${isCorrect ? '　✓' : ''}</div>`;
            }).join("");
            const streakText = (Number(r.correctStreak) || 0) > 0 ? `　最近連續答對 ${Number(r.correctStreak)} 次` : "";
            return `<div class="risk-row" style="padding:9px 0;border-bottom:1px solid #eee">
                <div><b style="font-weight:800">${i + 1}. </b><b class="v40-risk-percent">${rate}%</b>　${r.questionType || data.type || "題型未記錄"}　${r.subject}${streakText}</div>
                <div style="color:#333;margin-top:4px">${clean(r.question)}</div>
                <div style="margin-top:5px;padding-left:8px">${optionRows || '<span style="color:#888"></span>'}</div>
                <div style="color:#d63031;margin-top:4px">錯 ${r.wrong} / ${r.attempts} 次</div>
            </div>`;
        }).join("") || `<div style="color:#888">目前沒有足夠作答次數的高錯誤機率題目</div>`;

        const examDate = new Date(2026, 10, 7);
        const now = new Date();
        const msLeft = examDate - now;
        const daysLeft = Math.ceil(msLeft / 86400000);
        const countdownText = daysLeft > 0 ? `距離第四階段考試還有 <b>${daysLeft}</b> 天` : (daysLeft === 0 ? "📣 今天就是第四階段考試！" : "📣 第四階段測驗已經到了，繼續加油！");

        panel.innerHTML = `
          <div style="display:flex;justify-content:space-between;align-items:center;gap:8px">
            <b style="font-size:21px">📊 正確率</b>
            </div>
          <div class="stats-summary-better">
            <div class="stat-card"><div class="stat-label">總作答</div><div class="stat-value">${total}</div></div>
            <div class="stat-card"><div class="stat-label">答對</div><div class="stat-value">${correct}</div></div>
            <div class="stat-card"><div class="stat-label">錯誤</div><div class="stat-value">${wrong}</div></div>
            <div class="stat-card"><div class="stat-label">正確率</div><div class="stat-value">${accuracy.toFixed(1)}%</div></div>
          </div>`;
        document.getElementById("container").appendChild(panel);

        const subjectPanel = document.createElement("div");
        subjectPanel.id = "stats-detail-subjects";
        subjectPanel.style.cssText = "display:none;position:relative;z-index:1;width:calc(100% - 20px);max-width:1100px;box-sizing:border-box;margin:12px auto;padding:12px;border:2px solid #4b7bec;border-radius:14px;background:rgba(255,255,255,.94);font-size:16px;line-height:1.55;";
        subjectPanel.innerHTML = `<div style="font-weight:bold;font-size:18px;margin-bottom:8px">📚 各科狀況</div>${subjectRows}`;
        document.getElementById("container").appendChild(subjectPanel);

        const riskPanel = document.createElement("div");
        riskPanel.id = "stats-detail-risk";
        riskPanel.style.cssText = "display:none;position:relative;z-index:1;width:calc(100% - 20px);max-width:1100px;box-sizing:border-box;margin:12px auto;padding:12px;border:2px solid #d63031;border-radius:14px;background:rgba(255,255,255,.94);font-size:16px;line-height:1.55;";
        riskPanel.innerHTML = `<div style="font-weight:bold;font-size:18px;margin-bottom:8px">⚠️ 錯題 Top 30（依錯誤率由高至低排列）</div>${riskRows}`;
        document.getElementById("container").appendChild(riskPanel);

        const rankPanel = document.createElement("div");
        rankPanel.id = "stats-ranking-panel";
        rankPanel.style.cssText = "display:none;position:relative;z-index:1;width:calc(100% - 20px);max-width:1100px;box-sizing:border-box;margin:12px auto;padding:12px;border:2px solid #f0ad4e;border-radius:14px;background:rgba(255,255,255,.94);font-size:16px;line-height:1.55;";
        rankPanel.innerHTML = `<div id="stats-ranking" style="font-weight:bold;margin-bottom:7px;font-size:18px">🏆 班排行</div><div style="margin-bottom:7px;font-size:13px;color:#666">僅計測驗模式作答；顯示前 50 名。</div><div id="user-answer-ranking-list" style="color:#777">載入中...</div>`;
        document.getElementById("container").appendChild(rankPanel);
        loadUserAnswerRanking(document.getElementById("user-answer-ranking-list"));
    
    // 同步首頁正確率
    try {
        const stats = getErrorStats();
        let totalAttempts = 0, totalCorrect = 0;
        Object.values(stats || {}).forEach(item => {
            totalAttempts += Number(item.attempts) || 0;
            const wrong = Number(item.wrong) || 0;
            totalCorrect += Math.max(0, (Number(item.attempts) || 0) - wrong);
        });
        const accuracy = totalAttempts ? (totalCorrect / totalAttempts * 100) : 0;
        
    } catch (e) {
        console.warn("首頁正確率更新失敗：", e);
    }
}

    // 統計詳細內容按鈕：點擊後展開／收起
    function showStatsDetail(type) {
        const ids = ["subjects", "risk"];
        ids.forEach(id => {
            const el = document.getElementById("stats-detail-" + id);
            if (el) el.style.display = (id === type && el.style.display === "none") ? "block" : "none";
        });
    }

    function renderHomepageAnswerSummary() {
        const stats = (typeof getErrorStats === "function") ? (getErrorStats() || {}) : {};
        let total = 0, correct = 0, wrong = 0;
        Object.values(stats).forEach(item => {
            const attempts = Number(item.attempts) || 0;
            const itemCorrect = Number(item.correct) || 0;
            const itemWrong = Number(item.wrong) || 0;
            total += attempts;
            correct += itemCorrect;
            wrong += itemWrong;
        });
        if (correct + wrong === 0) correct = Math.max(0, total - wrong);
        const accuracy = total > 0 ? (correct / total * 100) : 0;

        const summary = document.createElement("div");
        summary.id = "homepageAnswerSummary";
        summary.setAttribute("aria-label", "答題統計");
        summary.innerHTML = `
          <div class="answer-stat">
            <div class="answer-stat-label">總作答</div>
            <div class="answer-stat-value">${total}</div>
          </div>
          <div class="answer-stat correct">
            <div class="answer-stat-label">答對</div>
            <div class="answer-stat-value">${correct}</div>
          </div>
          <div class="answer-stat wrong">
            <div class="answer-stat-label">答錯</div>
            <div class="answer-stat-value">${wrong}</div>
          </div>
          <div class="answer-stat accuracy">
            <div class="answer-stat-label">正確率</div>
            <div class="answer-stat-value">${accuracy.toFixed(1)}%</div>
          </div>
        `;
        return summary;
    }

    // 穩定的測驗操作函數：避免動態按鈕事件被其他程式影響
    function goBackToHomepage() {
        try {
            if (typeof cleanPage === "function") cleanPage();
            if (typeof showInitialPage === "function") showInitialPage();
            window.scrollTo({top:0, behavior:"smooth"});
        } catch (e) {
            console.error("回首頁失敗：", e);
            location.reload();

    function submitQuizSafely() {
        const btn = document.getElementById("resultButton");
        if (btn && btn.dataset.submitting === "1") return;

        try {
            if (typeof showResult !== "function") throw new Error("showResult 不存在");
            if (btn) {
                btn.dataset.submitting = "1";
                btn.disabled = true;
                btn.textContent = "計算中…";
            }

            // showResult 是同步結算流程；不能把按鈕永久卡在「送出中」
            showResult();

            // 結算完成後，按鈕改為完成狀態
            const doneBtn = document.getElementById("resultButton");
            if (doneBtn) {
                doneBtn.dataset.submitting = "0";
                doneBtn.disabled = true;
                doneBtn.textContent = "✓ 已送出";
            }
        } catch (e) {
            console.error("送出測驗失敗：", e);
            const failedBtn = document.getElementById("resultButton");
            if (failedBtn) {
                failedBtn.dataset.submitting = "0";
                failedBtn.textContent = "送出";
                failedBtn.disabled = false;
            }
            alert("送出時發生錯誤，請再試一次。");
        }
    }

    //函數:結算成績
    function showResult() {
	cIncorrect=0;
	sIncorrect=0;
	mIncorrect=0;

	//成績補正
	if(questions["是非"].length!=0&&questions["是非"].length<cQuestionNum)
	    totalScore+=(cQuestionNum-questions["是非"].length)*scorePerC;
	if(questions["單選"].length<sQuestionNum)
	    totalScore+=(sQuestionNum-questions["單選"].length)*scorePerS;
	if(questions["複選"].length<mQuestionNum)
	    totalScore+=(mQuestionNum-questions["複選"].length)*scorePerM;
	
	//成績補正

        //顯示隱藏項目
	document.getElementById("correctTdc").removeAttribute("style");
        document.getElementById("correctTds").removeAttribute("style");
        document.getElementById("correctTdm").removeAttribute("style");
	document.querySelectorAll("select").forEach((element) => {
            element.disabled = true;
        });
        document.querySelectorAll("input[type='radio']").forEach((element) => {// 複選題核對
            element.disabled = true;
        });
        document.querySelectorAll("input[type='checkbox']").forEach((element) => {
            element.disabled = true;
        });
        const resultButton = document.getElementById("resultButton");
        if (resultButton) {
            resultButton.disabled = true;
            resultButton.dataset.submitting = "1";
            resultButton.textContent = "計算完成";
        }
	document.getElementById("cHeader").colSpan = 3;
        document.getElementById("sHeader").colSpan = 3;
        document.getElementById("mHeader").colSpan = 3;
        document.getElementById("score").removeAttribute("style");
        //顯示隱藏項目

	//是非結算
        for (let i = 0; i < (cQuestionNum>questions["是非"].length?questions["是非"].length:cQuestionNum); i++) {
            document.getElementById("ct" + i).removeAttribute("style");
            //顯示答案
            document.getElementById("cp" + i).innerHTML = questions["是非"][i]["答案"];
            //顯示答案
            if (document.getElementById("sc" + i).value==questions["是非"][i]["答案"]) {
                document.getElementById("cr" + i).className = "correctRow";
                totalScore += scorePerC;
            } else {
                document.getElementById("cr" + i).className = "incorrectRow";
		cIncorrect++;
            }
            recordQuestionResult(questions["是非"][i], document.getElementById("cr" + i).className === "correctRow", "是非題");
        }
        //是非結算

        //單選結算（整題計錯：答錯一題只增加 1 題錯誤，不按選項數量累加）
        for (let i = 0; i < (sQuestionNum>questions["單選"].length?questions["單選"].length:sQuestionNum); i++) {
            document.getElementById("st" + i).removeAttribute("style");
            let cRadio = document.querySelector(`input[name='s${i}']:checked`);
            //顯示答案
            document.getElementById("sp" + i).innerHTML = questions["單選"][i]["選項"].indexOf(questions["單選"][i]["答案"]) + 1;
            //顯示答案
            if (cRadio && cRadio.value == questions["單選"][i]["答案"]) {
                document.getElementById("sr" + i).className = "correctRow";
                totalScore += scorePerS;
            } else {
                document.getElementById("sr" + i).className = "incorrectRow";
		sIncorrect++;
            }
            recordQuestionResult(questions["單選"][i], document.getElementById("sr" + i).className === "correctRow", "單選題");
        }
        //單選結算

        //複選結算（整題計錯：只有全部選項完全符合答案才算答對，否則只增加 1 題錯誤）
        for (let i = 0; i < (mQuestionNum>questions["複選"].length?questions["複選"].length:mQuestionNum); i++) {
            document.getElementById("mt" + i).removeAttribute("style");
            let cCheckbox = document.querySelectorAll(`input[name='m${i}']:checked`);
            let checkedtArr = [];
            for (let j = 0; j < cCheckbox.length; j++) {
                checkedtArr.push(questions["複選"][i]["選項"].indexOf(cCheckbox[j].value) + 1);
            }
            checkedtArr.sort();
            //顯示答案
            let correctArr = [];
            for (let j = 0; j < questions["複選"][i]["答案"].length; j++) {
                correctArr.push(questions["複選"][i]["選項"].indexOf(questions["複選"][i]["答案"][j]) + 1);
            }
            correctArr.sort()
            document.getElementById("mp" + i).innerHTML = correctArr.join("");
            //顯示答案

            if (isArrEqual(checkedtArr, correctArr)) {
                document.getElementById("mr" + i).className = "correctRow";
                totalScore += scorePerM;
            } else {
                document.getElementById("mr" + i).className = "incorrectRow";
		mIncorrect++;
            }
            recordQuestionResult(questions["複選"][i], document.getElementById("mr" + i).className === "correctRow", "複選題");
        }
        //複選結算

        // 計算錯誤率（以實際顯示的題目數為分母；未作答也算錯）
        const actualQuestionCount =
            (questions["是非"] ? Math.min(cQuestionNum, questions["是非"].length) : 0) +
            (questions["單選"] ? Math.min(sQuestionNum, questions["單選"].length) : 0) +
            (questions["複選"] ? Math.min(mQuestionNum, questions["複選"].length) : 0);
        const incorrectCount = cIncorrect + sIncorrect + mIncorrect;
        const errorRate = actualQuestionCount > 0 ? (incorrectCount / actualQuestionCount) * 100 : 0;

        // 儲存最近一次測驗結果，回首頁時可以看到錯誤率
        localStorage.setItem("lastErrorRate", errorRate.toFixed(1));
        localStorage.setItem("lastIncorrectCount", incorrectCount);
        localStorage.setItem("lastQuestionCount", actualQuestionCount);
        localStorage.setItem("lastTestTime", new Date().toLocaleString("zh-TW"));

        //顯示成績
	document.getElementById("score").innerHTML = "階段考通過的機率為: " + totalScore+ "%<br>錯誤率: " + errorRate.toFixed(1) + "%（錯 " + incorrectCount + " / " + actualQuestionCount + " 題）";

	// 高分上鎖提示：95 分以上直接上鎖
	if (typeof showLockMessage === "function" && totalScore >= 95 && !fullQuestion) {
		showLockMessage(totalScore);
	}
	// 低分羞辱：75 分以下才觸發
	else if (typeof showShameMessage === "function" && totalScore < 75 && !fullQuestion) {
		showShameMessage(totalScore);
	}

	if(fullQuestion)
		document.getElementById("score").innerHTML = "是非錯: " + cIncorrect+"題，"+"單選錯: " + sIncorrect+"題，"+"複選錯: " + mIncorrect+"題";
	window.scrollTo(0,document.body.scrollHeight);
}

/* ▼▼▼ 1. 跳轉定位函式 ▼▼▼ */
function scrollToSection(type) {
    var target = null;
    if (type === 'single') {
        target = document.getElementById("sr0") || document.getElementById("s0") || document.getElementById("single0");
    } else if (type === 'multiple') {
        target = document.getElementById("mr0") || document.getElementById("m0") || document.getElementById("multiple0");
    }

    if (!target) {
        var keyword = (type === 'single') ? "單選" : "複選";
        var elements = document.querySelectorAll("h1, h2, h3, h4, div, span, td, legend, p");
        for (var i = 0; i < elements.length; i++) {
            if (elements[i].innerText && elements[i].innerText.indexOf(keyword) !== -1) {
                target = elements[i];
                break;
            }
        }
    }

    if (target) {
        target.scrollIntoView({ behavior: "smooth", block: "start" });
    } else {
        alert("找不到" + (type === 'single' ? "單選題" : "複選題") + "位置！");
    }
}

/* ▼▼▼ 2. 判斷邏輯：首頁（有神奇寶貝圖/無單複選題目）隱藏，送出進入題目頁才顯示 ▼▼▼ */
function updateButtonDisplay() {
    var btnContainer = document.getElementById("scroll-btns");
    var btnSingle = document.getElementById("btn-single");
    if (!btnContainer) return;

    // 判斷頁面上是否有真正的「單選」或「複選」題目內容 (即 radio/checkbox 選項，或是第 1 題題號 s0 / m0)
    var hasSingleQ = document.getElementById("s0") || document.getElementById("sr0") || document.querySelector("input[type='radio']");
    var hasMultipleQ = document.getElementById("m0") || document.getElementById("mr0") || document.querySelector("input[type='checkbox']");

    // 只要沒有任何單選或複選題目（代表還在首頁圖片區），一律強制隱藏按鈕
    if (!hasSingleQ && !hasMultipleQ) {
        btnContainer.style.display = "none";
        return;
    }

    // 點進來且有題目載入後，顯示按鈕區塊
    btnContainer.style.display = "flex";

    // 如果只有複選題（沒有單選題），自動隱藏「★ 單選」按鈕，只留 3 顆；若有單選題則顯示 4 顆
    if (btnSingle) {
        btnSingle.style.display = hasSingleQ ? "block" : "none";
    }
}

async function bootAuthenticatedPage(){
  try {
    const { data: { user } } = await supabaseClient.auth.getUser();
    if (!user) return;

    questionStatsCurrentUserId = user.id;
    localStorage.setItem("questionStatsCurrentUserId", user.id);
    document.body.classList.add("supabase-authenticated");

    // 先載入目前 user_id 的雲端紀錄，再建立首頁。
    if (typeof loadCurrentUserQuestionStatsFromSupabase === "function") {
      try {
        await loadCurrentUserQuestionStatsFromSupabase();
      } catch (e) {
        console.warn("載入個人答題紀錄失敗，仍繼續建立首頁：", e);
      }
    }

    if (typeof refreshUserProfile === "function") {
      try { await refreshUserProfile(); }
      catch(e) { console.warn("載入個人資料失敗，仍繼續建立首頁：", e); }
    }

    if (typeof cleanPage === "function") cleanPage();
    if (typeof showInitialPage === "function") showInitialPage();
    if (typeof updateHomepageErrorRate === "function") updateHomepageErrorRate();
  } catch (e) {
    console.error("登入狀態初始化失敗：", e);
  }
}

if (document.readyState === "loading") {
  document.addEventListener("DOMContentLoaded", bootAuthenticatedPage, { once:true });
} else {
  bootAuthenticatedPage();
}

// 監聽按鈕點擊與選單切換，點擊「送出」產生題目時自動顯示按鈕
document.addEventListener("change", updateButtonDisplay);
document.addEventListener("click", function() {
    setTimeout(updateButtonDisplay, 100);
    setTimeout(updateButtonDisplay, 300);
});

// 初始先執行一次隱藏
updateButtonDisplay();
</script>
